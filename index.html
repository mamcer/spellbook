<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spellbook</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<!-- vue.css, buble.css, dark.css, pure.css, dolphin.css -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
</head>
<body>
  <div id="app"></div>
  <script>
  window.$docsify = {
    name: 'Spellbook',
    repo: 'https://github.com/mamcer/spellbook',
    loadSidebar: true,                // Enable loading _sidebar.md
    loadNavbar: true,                 // Enable loading _navbar.md
    coverpage: false,                  // Enable coverpage (_coverpage.md)
    homepage: 'README.md',            // Set default homepage
    auto2top: true,                   // Scroll to top on route change
    maxLevel: 4,                      // Max sidebar TOC depth
    subMaxLevel: 2,                   // Max sub sidebar TOC depth
    search: {
      maxAge: 86400000,
      paths: 'auto',
      placeholder: 'Type to search',
      noData: 'No Results!',
      depth: 6,
      hideOtherSidebarContent: false,
    },
    mergeNavbar: true,                // Merge navbar into sidebar on small screens
    notFoundPage: true,               // Enable custom 404 page (_404.md)
    themeColor: '#42b983',            // Theme color
    externalLinkTarget: '_blank',     // Open external links in new tab
    pagination: {
      previousText: 'Previous',
      nextText: 'Next',
      crossChapter: true,
      crossChapterText: true,
    },
    mermaidConfig: {
      querySelector: ".mermaid"
    }
  }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
